<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ng-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="55%" stop-color="#dc2640"/>
      <stop offset="100%" stop-color="#7a0a1f"/>
    </linearGradient>
    <linearGradient id="ng-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0610"/>
      <stop offset="100%" stop-color="#08020a"/>
    </linearGradient>
    <radialGradient id="ng-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff3b5c" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#dc2640" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#dc2640" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer rounded square with crimson gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#ng-red)"/>

  <!-- Inner darker orb -->
  <circle cx="32" cy="32" r="22" fill="url(#ng-inner)"/>

  <!-- Soft inner glow -->
  <circle cx="32" cy="32" r="22" fill="url(#ng-glow)"/>

  <!-- Two eye slots (skull-like, sharper) -->
  <path d="M 22 26 Q 22 22 26 22 L 28 22 Q 32 22 32 26 L 32 30 Q 32 34 28 34 L 26 34 Q 22 34 22 30 Z" fill="#ff3b5c" opacity="0.95"/>
  <path d="M 32 26 Q 32 22 36 22 L 38 22 Q 42 22 42 26 L 42 30 Q 42 34 38 34 L 36 34 Q 32 34 32 30 Z" fill="#ff3b5c" opacity="0.95"/>

  <!-- Pupil glints -->
  <circle cx="27" cy="28" r="1.4" fill="#ffe5ea"/>
  <circle cx="37" cy="28" r="1.4" fill="#ffe5ea"/>

  <!-- Nasal cavity (inverted triangle) -->
  <path d="M 32 36 L 30 41 Q 32 42 34 41 Z" fill="#ff3b5c" opacity="0.85"/>

  <!-- Teeth row (subtle) -->
  <g fill="#ff3b5c" opacity="0.7">
    <rect x="26" y="44" width="2.5" height="4" rx="0.4"/>
    <rect x="29.5" y="44.5" width="2.5" height="3.5" rx="0.4"/>
    <rect x="33" y="44.5" width="2.5" height="3.5" rx="0.4"/>
    <rect x="36.5" y="44" width="2.5" height="4" rx="0.4"/>
  </g>
</svg>
